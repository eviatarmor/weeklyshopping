name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:check
      - run: pnpm build
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cp .dev.vars.example .dev.vars
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  deploy:
    # Runs once the Cloudflare settings exist in the repo (see infra/terraform/README.md).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ACCESS_AUD != ''
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy Worker
        run: >-
          pnpm exec wrangler deploy
          --var "ACCESS_TEAM_DOMAIN:${{ vars.ACCESS_TEAM_DOMAIN }}"
          --var "ACCESS_AUD:${{ vars.ACCESS_AUD }}"
      - name: Update allowed members
        env:
          HOUSEHOLD_MEMBERS: ${{ secrets.HOUSEHOLD_MEMBERS }}
        run: printf '%s' "$HOUSEHOLD_MEMBERS" | pnpm exec wrangler secret put HOUSEHOLD_MEMBERS
      - name: Update push notification key
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        if: env.VAPID_PRIVATE_KEY != ''
        run: printf '%s' "$VAPID_PRIVATE_KEY" | pnpm exec wrangler secret put VAPID_PRIVATE_KEY
