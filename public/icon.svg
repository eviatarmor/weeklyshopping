<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa56b"/>
      <stop offset="1" stop-color="#1e6b45"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd356"/>
      <stop offset="1" stop-color="#d4f28a"/>
    </linearGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f1e6cf"/>
    </linearGradient>
  </defs>

  <!-- Background (rounded for favicons; PNG icons are rendered full-bleed). -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Artwork scaled into the centre so circular (maskable) crops keep everything. -->
  <g transform="translate(256 262) scale(0.86) translate(-256 -262)">

    <!-- Leaves sprouting from the basket. -->
    <path d="M262 236 C250 170 278 112 352 92 C366 158 336 214 262 236 Z" fill="url(#leaf)"/>
    <path d="M262 236 C292 190 318 150 344 106" fill="none" stroke="#5f9d2e" stroke-width="7" stroke-linecap="round"/>
    <path d="M246 238 C206 214 186 178 192 134 C236 140 262 176 262 222 Z" fill="#8cc84b"/>
    <path d="M248 232 C232 206 214 180 198 146" fill="none" stroke="#4f8a26" stroke-width="6" stroke-linecap="round"/>

    <!-- Basket handle. -->
    <path d="M150 248 C150 162 362 162 362 248" fill="none" stroke="#fffaf0" stroke-width="22" stroke-linecap="round"/>

    <!-- Basket rim and body. -->
    <rect x="104" y="232" width="304" height="44" rx="22" fill="#fffaf0"/>
    <path d="M126 276 H386 L360 404 C356 422 342 432 324 432 H188 C170 432 156 422 152 404 Z" fill="url(#basket)"/>

    <!-- Weave. -->
    <g stroke="#e2d2b0" stroke-width="10" stroke-linecap="round">
      <path d="M190 296 L204 414"/>
      <path d="M256 296 V416"/>
      <path d="M322 296 L308 414"/>
    </g>

    <!-- Check mark badge: the list is done. -->
    <circle cx="352" cy="374" r="60" fill="#ffffff"/>
    <circle cx="352" cy="374" r="48" fill="#2f8f5b"/>
    <path d="M329 375 L346 392 L376 357" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
